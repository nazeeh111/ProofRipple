<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc"><title id="title">One checked consequence, four bounded searches</title><desc id="desc">Explicit implication assumptions form p0 through p11. Seed p4 to p6 composes h4 and h5. Selected p4 to p11 composes the seed and h6 through h10. At eight expansions, starting registry solves one of four, adding the selected consequence solves four. Longer chain control solves none.</desc><rect width="100%" height="100%" fill="#101b18"/><text x="28" y="38" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">PROOFRIPPLE / CORE LEAN</text><text x="28" y="79" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Prove once. Reuse under a budget.</text><text x="28" y="111" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Known implication composition; explicit assumptions.</text><text x="28" y="157" fill="#e5c989" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">01  EXPLICIT CONDITIONAL HYPOTHESES</text><text x="43" y="211" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p0</text><path d="M71 205 L119 205" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="77" y="191" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">h0</text><text x="135" y="211" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p1</text><path d="M163 205 L211 205" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="169" y="191" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">h1</text><text x="227" y="211" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p2</text><path d="M255 205 L303 205" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="261" y="191" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">h2</text><text x="319" y="211" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p3</text><path d="M347 205 L395 205" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="353" y="191" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">h3</text><text x="411" y="211" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p4</text><path d="M439 205 L487 205" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="445" y="191" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">h4</text><text x="503" y="211" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p5</text><path d="M531 205 L579 205" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="537" y="191" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">h5</text><text x="595" y="211" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p6</text><path d="M623 205 L671 205" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="629" y="191" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">h6</text><text x="687" y="211" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p7</text><path d="M715 205 L763 205" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="721" y="191" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">h7</text><text x="779" y="211" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p8</text><path d="M807 205 L855 205" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="813" y="191" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">h8</text><text x="871" y="211" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p9</text><path d="M899 205 L947 205" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="905" y="191" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">h9</text><text x="963" y="211" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p10</text><path d="M991 205 L1039 205" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="997" y="191" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">h10</text><text x="1055" y="211" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p11</text><path d="M423 226 V245 H607 V226" fill="none" stroke="#a9e7c0" stroke-width="3"/><text x="439" y="268" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">seed p4 → p6</text><path d="M423 286 V307 H1067 V226" fill="none" stroke="#e5c989" stroke-width="3"/><text x="439" y="332" fill="#e5c989" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">selected p4 → p11 = seed, h6, h7, h8, h9, h10</text><text x="28" y="385" fill="#e5c989" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">02  SAME 8-EXPANSION LIMIT · GRAPH HEURISTIC · 1 SELECTED LEMMA</text><text x="28" y="423" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Goal</text><text x="230" y="423" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Starting registry</text><text x="620" y="423" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">+ consequence</text><text x="28" y="455" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">p0 → p11</text><text x="230" y="455" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">8 · not found</text><text x="620" y="455" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">5 · solved</text><text x="28" y="487" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">p1 → p11</text><text x="230" y="487" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">8 · not found</text><text x="620" y="487" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">4 · solved</text><text x="28" y="519" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">p2 → p11</text><text x="230" y="519" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">8 · not found</text><text x="620" y="519" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">3 · solved</text><text x="28" y="551" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">p3 → p11</text><text x="230" y="551" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">8 · solved</text><text x="620" y="551" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">2 · solved</text><path d="M28 576 L1092 576" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="28" y="591" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">1/4 → 4/4 goals solved in this saved case</text><text x="28" y="627" fill="#e5c989" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">03  LONGER CHAIN CONTROL</text><text x="28" y="656" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">p0…p3 → p17: 0/4 → 0/4 at the same budget.</text><text x="28" y="685" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Not found ≠ false. This is not a new theorem</text><text x="28" y="706" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">or evidence of superiority over Lean automation.</text><text x="28" y="774" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Lean 4.33.1 · empty transitive axiom lists · saved raw runs</text></svg>