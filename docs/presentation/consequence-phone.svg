<svg xmlns="http://www.w3.org/2000/svg" width="400" height="960" viewBox="0 0 400 960" role="img" aria-labelledby="title desc"><title id="title">One checked consequence, four bounded searches</title><desc id="desc">Explicit implication assumptions form p0 through p11. Seed p4 to p6 composes h4 and h5. Selected p4 to p11 composes the seed and h6 through h10. At eight expansions, starting registry solves one of four, adding the selected consequence solves four. Longer chain control solves none.</desc><rect width="100%" height="100%" fill="#101b18"/><text x="28" y="38" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">PROOFRIPPLE / CORE LEAN</text><text x="28" y="79" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Prove once. Reuse under a budget.</text><text x="28" y="111" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Known implication composition; explicit assumptions.</text><text x="28" y="156" fill="#e5c989" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">01  THE PREMISES</text><text x="38" y="192" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p4</text><path d="M51 198 L51 214" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="74" y="213" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">h4 : p4 → p5</text><text x="38" y="228" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p5</text><path d="M51 234 L51 250" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="74" y="249" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">h5 : p5 → p6</text><text x="38" y="264" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p6</text><path d="M51 270 L51 286" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="74" y="285" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">h6 : p6 → p7</text><text x="38" y="300" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p7</text><path d="M51 306 L51 322" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="74" y="321" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">h7 : p7 → p8</text><text x="38" y="336" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p8</text><path d="M51 342 L51 358" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="74" y="357" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">h8 : p8 → p9</text><text x="38" y="372" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p9</text><path d="M51 378 L51 394" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="74" y="393" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">h9 : p9 → p10</text><text x="38" y="408" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p10</text><path d="M51 414 L51 430" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="74" y="429" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">h10 : p10 → p11</text><text x="38" y="444" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">p11</text><path d="M204 187 L204 259" fill="none" stroke="#a9e7c0" stroke-width="3"/><text x="222" y="220" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Seed</text><text x="222" y="242" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">p4 → p6</text><path d="M190 187 L190 440" fill="none" stroke="#e5c989" stroke-width="3"/><text x="222" y="346" fill="#e5c989" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Selected</text><text x="222" y="370" fill="#e5c989" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">p4 → p11</text><text x="28" y="490" fill="#e5c989" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">02  SAME 8-EXPANSION LIMIT</text><text x="28" y="528" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Goal</text><text x="130" y="528" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Starting registry</text><text x="270" y="528" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">+ consequence</text><text x="28" y="560" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">p0 → p11</text><text x="130" y="560" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">8 · not found</text><text x="270" y="560" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">5 · solved</text><text x="28" y="592" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">p1 → p11</text><text x="130" y="592" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">8 · not found</text><text x="270" y="592" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">4 · solved</text><text x="28" y="624" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">p2 → p11</text><text x="130" y="624" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">8 · not found</text><text x="270" y="624" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">3 · solved</text><text x="28" y="656" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">p3 → p11</text><text x="130" y="656" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">8 · solved</text><text x="270" y="656" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">2 · solved</text><path d="M28 681 L372 681" fill="none" stroke="#a9bdb0" stroke-width="1"/><text x="28" y="696" fill="#a9e7c0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">1/4 → 4/4 goals solved in this saved case</text><text x="28" y="732" fill="#e5c989" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">03  LONGER CHAIN CONTROL</text><text x="28" y="761" fill="#e9f0e8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">p0…p3 → p17: 0/4 → 0/4 at the same budget.</text><text x="28" y="790" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Not found ≠ false. This is not a new theorem</text><text x="28" y="811" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">or evidence of superiority over Lean automation.</text><text x="28" y="934" fill="#a9bdb0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400">Lean 4.33.1 · empty transitive axiom lists · saved raw runs</text></svg>