[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofripple"
version = "0.3.0"
description = "Mathlib consequence discovery, held-out usefulness experiments and a compact research lab"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Nazeeh", email = "nazeeh111@users.noreply.github.com"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Mathematics"]
dependencies = []

[project.scripts]
proofripple = "proofripple.cli:main"

[project.urls]
Repository = "https://github.com/nazeeh111/ProofRipple"
Issues = "https://github.com/nazeeh111/ProofRipple/issues"

[tool.setuptools]
packages = ["proofripple"]
